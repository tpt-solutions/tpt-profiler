# tpt-profiler workspace (spec §61)
# Dependency direction: model ← analysis crates ← core ← cli (see DESIGN.md §2).

[workspace]
resolver = "3"
members = [
    "crates/tpt-profiler",
    "crates/tpt-profiler-cli",
    "crates/tpt-profiler-model",
    "crates/tpt-profiler-static",
    "crates/tpt-profiler-runtime",
    "crates/tpt-profiler-bench",
    "crates/tpt-profiler-memory",
    "crates/tpt-profiler-build",
    "crates/tpt-profiler-opportunity",
    "crates/tpt-profiler-report",
]
exclude = ["tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-profiler"
readme = "../../README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Noise allowances (deliberate, reviewed):
module_name_repetitions = "allow"      # crate-prefixed type names are the norm here
missing_errors_doc = "allow"           # error taxonomy is documented centrally (DESIGN.md §4)
missing_panics_doc = "allow"
doc_markdown = "allow"
multiple_crate_versions = "allow"      # transitive duplicates are tracked by cargo-deny instead

[workspace.dependencies]
# Workspace crates
tpt-profiler = { path = "crates/tpt-profiler", version = "0.1.0" }
tpt-profiler-model = { path = "crates/tpt-profiler-model", version = "0.1.0" }
tpt-profiler-static = { path = "crates/tpt-profiler-static", version = "0.1.0" }
tpt-profiler-runtime = { path = "crates/tpt-profiler-runtime", version = "0.1.0" }
tpt-profiler-bench = { path = "crates/tpt-profiler-bench", version = "0.1.0" }
tpt-profiler-memory = { path = "crates/tpt-profiler-memory", version = "0.1.0" }
tpt-profiler-build = { path = "crates/tpt-profiler-build", version = "0.1.0" }
tpt-profiler-opportunity = { path = "crates/tpt-profiler-opportunity", version = "0.1.0" }
tpt-profiler-report = { path = "crates/tpt-profiler-report", version = "0.1.0" }

# Error handling
thiserror = { version = "2.0", default-features = false }

# Serialisation (serde is no_std in the model crate; std users add "std")
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0"

# Static analysis
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }

# Discovery
cargo_metadata = "0.20"
ignore = "0.4"
walkdir = "2"

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"

# Config
toml = "0.8"

# Logging (facade only — see DESIGN.md §8)
log = "0.4"

[profile.release]
lto = "thin"
strip = "debuginfo"
