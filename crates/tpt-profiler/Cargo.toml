[package]
name = "tpt-profiler"
description = "Core orchestration library for tpt-profiler: discovery → analysis → evidence → opportunities → priority → report (spec §5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["profiling", "performance", "optimisation"]
categories = ["development-tools"]

[features]
# The core crate performs filesystem and `cargo metadata` work, so it is
# std-only; the `std` feature forwards to the model crate so embedders can
# keep the whole dependency tree on one std setting (spec §73).
default = ["std"]
std = ["tpt-profiler-model/std"]

[dependencies]
tpt-profiler-model = { workspace = true, features = ["serde"] }
tpt-profiler-opportunity.workspace = true
tpt-profiler-static.workspace = true
tpt-profiler-runtime.workspace = true
tpt-profiler-bench.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
cargo_metadata.workspace = true
ignore.workspace = true

[lints]
workspace = true
